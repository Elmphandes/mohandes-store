<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#164e63">
  <title>مكتبة المهندس | أدوات مكتبية وطلبات طباعة</title>
  <style>
    :root {
      --ink: #17324d;
      --teal: #0f766e;
      --teal-dark: #115e59;
      --cream: #f8f7f2;
      --muted: #64748b;
      --line: #e2e8f0;
      --white: #fff;
      --gold: #f4b942;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--cream);
      font-family: Tahoma, Arial, sans-serif;
      line-height: 1.7;
    }
    a { color: inherit; text-decoration: none; }
    .wrap { width: min(1100px, 92%); margin: auto; }
    header {
      background: var(--white);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .nav { min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { font-size: 1.25rem; font-weight: 800; color: var(--teal-dark); }
    .navlinks { display: flex; align-items: center; gap: 22px; font-size: .94rem; }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 10px;
      padding: 11px 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      background: var(--teal);
      color: var(--white);
    }
    .button:hover { background: var(--teal-dark); }
    .button.light { color: var(--teal-dark); background: var(--white); }
    .hero {
      padding: 70px 0;
      background: radial-gradient(circle at 15% 25%, #d5eee5 0, transparent 30%),
        linear-gradient(135deg, #eaf5f1, #f8f7f2 70%);
    }
    .hero-grid { display: grid; grid-template-columns: 1.2fr .8fr; align-items: center; gap: 38px; }
    .tag { color: var(--teal); font-weight: 700; }
    h1 { font-size: clamp(2rem, 5vw, 3.5rem); line-height: 1.2; margin: 10px 0 16px; }
    .hero p { max-width: 590px; color: #475569; font-size: 1.08rem; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
    .hero-card {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 18px 45px #17324d12;
    }
    .hero-icon { font-size: 5rem; text-align: center; }
    .hero-card h2 { text-align: center; margin: 0; }
    section { padding: 58px 0; }
    .section-head { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 25px; }
    .section-head h2 { font-size: 1.8rem; margin: 0; }
    .section-head p { color: var(--muted); margin: 4px 0 0; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .card { background: var(--white); border: 1px solid var(--line); border-radius: 16px; padding: 22px; }
    .card-icon { font-size: 2rem; }
    .card h3 { margin: 8px 0 5px; }
