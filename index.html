<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكتبة المهندس - Mohandes Store</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
body { background-color: #f8f9fa; color: #333; line-height: 1.6; }
header { background: linear-gradient(135deg, #0056b3, #002b5b); color: white; padding: 2rem 1rem; text-align: center; }
header h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
.container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; margin-bottom: 3rem; }
.card { background: #ffffff; border-radius: 10px; padding: 1.5rem; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
.card h3 { margin-bottom: 0.5rem; color: #0056b3; }
footer { background: #222; color: white; text-align: center; padding: 1.5rem 1rem; margin-top: 2rem; }
</style>
</head>
<body>
<header>
<h1>مكتبة المهندس</h1>
<p>كل ما تحتاجه من أدوات مكتبية، مدرسية، وخدمات طباعة في مكان واحد</p>
</header>
<div class="container">
<div class="grid">
<div class="card">
<h3> أدوات مدرسية ومكتبية</h3>
<p>تشكيلة واسعة من الكشكول، الكراريس، الأقلام، والمستلزمات الدراسية.</p>
</div>
<div class="card">
<h3> خدمات طباعة وتصوير</h3>
<p>تصوير أوراق، طباعة مستندات أبيض وأسود وألوان بأعلى جودة.</p>
</div>
</div>
</div>
<footer>
<p>جميع الحقوق محفوظة &copy; 2026 - مكتبة المهندس</p>
</footer>
</body>
</html>
