<style>
:root {
--primary-color: #0056b3;
--secondary-color: #ff9900;
--bg-color: #f8f9fa;
--text-color: #333;
--card-bg: #ffffff;
}

* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: 'Tajawal', sans-serif;
}

body {
background-color: var(--bg-color);
color: var(--text-color);
line-height: 1.6;
}

/* الهيدر والعنوان */
header {
background: linear-gradient(135deg, var(--primary-color), #002b5b);
color: white;
padding: 2rem 1rem;
text-align: center;
box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}

header h1 {
font-size: 2.5rem;
margin-bottom: 0.5rem;
}

header p {
font-size: 1.1rem;
opacity: 0.9;
}

/* الحاوية الرئيسية */
.container {
max-width: 1100px;
margin: 2rem auto;
padding: 0 1rem;
}

/* شبكة المنتجات والخدمات */
.section-title {
text-align: center;
margin-bottom: 1.5rem;
color: var(--primary-color);
position: relative;
}

.grid {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
gap: 1.5rem;
margin-bottom: 3rem;
}
